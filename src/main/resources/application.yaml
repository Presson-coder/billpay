spring:
  application:
    name: billpay-service

  # In-memory H2 database (local/test use only)
  datasource:
    url: jdbc:h2:mem:billpay;DB_CLOSE_DELAY=-1
    username: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true

  # Never leak internals to API callers
  web:
    error:
      include-stacktrace: never
      include-message: never

# Expose only the health endpoint (used by Docker and the AWS load balancer)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Biller gateway: never wait longer than 3 seconds for an answer
billpay:
  gateway:
    timeout: 3s
    pool-size: 10
    queue-capacity: 50
